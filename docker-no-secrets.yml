# Local override for building without ~/.m2/settings.xml and ~/.m2/settings-security.xml.
# Removes the Maven build secrets from the services in docker-compose.yml; the Dockerfile
# then builds with Maven's defaults (public repositories only).
# LOCAL_PARENT_POM makes the Dockerfile use the local copy of sbprojects-parent in
# pom-local-parent.xml instead of Nexus.
#
# Usage:
#   docker compose -f docker-no-secrets.yml up --build

include:
  - docker-compose.yml

x-no-maven-secrets: &no-maven-secrets
  build:
    secrets: !reset []
    args:
      LOCAL_PARENT_POM: "true"

services:
  ds-storage: *no-maven-secrets
  ds-license: *no-maven-secrets
  ds-present: *no-maven-secrets
  ds-datahandler: *no-maven-secrets
  ds-discover: *no-maven-secrets
  ds-image: *no-maven-secrets
  bff: *no-maven-secrets

secrets: !reset {}
